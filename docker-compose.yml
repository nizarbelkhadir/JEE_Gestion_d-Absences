version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_gestion_absences
    environment:
      POSTGRES_DB: gestion_absences
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
